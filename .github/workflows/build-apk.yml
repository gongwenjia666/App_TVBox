name: Build TV APK

# 自建出包流水线：只做 APK 构建，不碰官网 pages
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Gradle 任务（默认 TV release）'
        required: true
        default: ':app:assembleLeanbackRelease'
permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Chaquopy 按 python3.10 精确版本找解释器，runner 上只有 python3，补个软链
      - name: Set up Python 3.10 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Link python3.10
        run: |
          set -e
          PY=$(command -v python3)
          DIR=$(dirname "$PY")
          [ -f "$DIR/python3.10" ] || ln -sf "$PY" "$DIR/python3.10"
          python3.10 --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # app/build.gradle 硬读 rootProject/local.properties
      - name: Prepare local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Inspect SDK
        run: |
          echo "platforms: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"
          echo "ndk: $(ls "$ANDROID_HOME/ndk" 2>/dev/null | tr '\n' ' ')"
          echo "cmake: $(ls "$ANDROID_HOME/cmake" 2>/dev/null | tr '\n' ' ')"

      # app/libs/lib-*.aar 不入库；从公开的 FongMi/media 定制分支现场编译
      - name: Build media3 AARs
        run: |
          set -e
          git clone --depth 1 --branch release-1.11.0-fongmi https://github.com/FongMi/media.git "$RUNNER_TEMP/media"
          cd "$RUNNER_TEMP/media"
          MODULES="lib-common lib-container lib-database lib-datasource lib-datasource-okhttp lib-datasource-rtmp lib-decoder lib-decoder-ffmpeg lib-decoder-mpegh lib-effect lib-exoplayer lib-exoplayer-dash lib-exoplayer-hls lib-exoplayer-rtsp lib-exoplayer-smoothstreaming lib-extractor lib-session lib-ui lib-ui-danmaku lib-mpvplayer"
          TASKS=""
          for m in $MODULES; do TASKS="$TASKS :$m:assembleRelease"; done
          chmod +x gradlew
          ./gradlew $TASKS -x lint --no-daemon --max-workers=4
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          for aar in libraries/*/buildout/outputs/aar/*.aar; do
            mod=$(echo "$aar" | cut -d/ -f2 | tr '_' '-')
            cp -v "$aar" "$GITHUB_WORKSPACE/app/libs/lib-${mod}-release.aar"
          done
          ls -lh "$GITHUB_WORKSPACE/app/libs"

      - name: Check AAR
        run: |
          set -e
          cd app/libs
          for f in lib-mpvplayer-release.aar lib-decoder-ffmpeg-release.aar lib-common-release.aar lib-exoplayer-release.aar; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
          ls -1 *.aar | wc -l

      - name: Generate throwaway keystore
        run: |
          set -e
          keytool -genkeypair -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=FongMi TV, OU=TV, O=TV, C=CN" > /dev/null
          {
            echo "storeFile=../release.keystore"
            echo "keyAlias=release"
            echo "storePassword=android"
            echo "keyPassword=android"
          } >> local.properties
          cat local.properties

      - name: Build ${{ inputs.task }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ inputs.task }} \
            -x :app:verifyLeanbackReleaseMpvNative \
            -x :app:verifyMobileReleaseMpvNative \
            --no-daemon --stacktrace

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} dist/ \; || true
          ls -lh dist || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TV-APK-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: warn
