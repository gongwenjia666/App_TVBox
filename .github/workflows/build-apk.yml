name: Build TV APK

# 自建出包流水线：只做 APK 构建，不碰官网 pages
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Gradle 任务（默认 TV release）'
        required: true
        default: ':app:assembleLeanbackRelease'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Chaquopy 按 python3.10 精确版本找解释器，runner 上只有 python3，补个软链
      - name: Set up Python 3.10 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Link python3.10
        run: |
          set -e
          PY=$(command -v python3)
          DIR=$(dirname "$PY")
          [ -f "$DIR/python3.10" ] || ln -sf "$PY" "$DIR/python3.10"
          python3.10 --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 工程里的 app/build.gradle 会硬读 rootProject/local.properties，必须先造出来
      - name: Prepare local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Inspect SDK
        run: |
          echo "platforms: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"
          echo "ndk: $(ls "$ANDROID_HOME/ndk" 2>/dev/null | tr '\n' ' ')"
          echo "cmake: $(ls "$ANDROID_HOME/cmake" 2>/dev/null | tr '\n' ' ')"

      # lib-*.aar（Media3 + mpv/ffmpeg 原生扩展）被 .gitignore 排除，仓库里没有；
      # 从公开的 ci-libs 发布物取一份补齐
      - name: Fetch lib-*.aar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p app/libs
          gh release download ci-libs --repo lixiangyong9131/TV --dir app/libs --pattern 'lib-*.aar' --clobber
          ls -1 app/libs | head -30
          for f in app/libs/lib-mpvplayer-release.aar app/libs/lib-decoder-ffmpeg-release.aar; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done

      - name: Generate throwaway keystore
        run: |
          set -e
          keytool -genkeypair -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=FongMi TV, OU=TV, O=TV, C=CN" > /dev/null
          {
            echo "storeFile=../release.keystore"
            echo "keyAlias=release"
            echo "storePassword=android"
            echo "keyPassword=android"
          } >> local.properties
          cat local.properties

      # ci-libs 里的 lib-*.aar 是旧版“分裂 ffmpeg”布局，新版 VerifyMpvNativeTask 会判定不合格；
      # 该任务是作者的质量闸门，不影响产物打包，这里跳过
      - name: Build ${{ inputs.task }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ inputs.task }} \
            -x :app:verifyLeanbackReleaseMpvNative \
            -x :app:verifyMobileReleaseMpvNative \
            --no-daemon --stacktrace

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} dist/ \; || true
          ls -lh dist || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TV-APK-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: warn
